# Fail the install (don't just warn) when a dev's Node/pnpm doesn't satisfy
# the "engines" field in package.json — keeps every environment on the same
# runtime.
engineStrict: true

# Pin exact versions on `pnpm add` (no `^` ranges) so every dependency is
# locked in package.json, not just the lockfile.
saveExact: true

allowBuilds:
  # swagger-ui-dist's postinstall telemetry pinger — not needed, deny it.
  '@scarf/scarf': false
  esbuild: true
  # Downloads the mongod binary used by tests/helpers/db.ts's in-memory MongoDB.
  mongodb-memory-server: true

# Newly published versions are held back for a day by default (supply-chain
# protection). mongoose@8.24.2 is pinned specifically to pull in a fix for a
# high-severity advisory (GHSA-wpg9-53fq-2r8h) — exempt it so the fix isn't
# delayed a day behind its release.
minimumReleaseAgeExclude:
  - mongoose@8.24.2
