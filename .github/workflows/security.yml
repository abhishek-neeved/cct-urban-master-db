name: Security

on:
  push:
    branches: [uat, main]
  pull_request:
    branches: [uat, main]
  schedule:
    # Weekly, Monday 06:00 UTC — catches newly disclosed CVEs in pinned deps.
    - cron: '0 6 * * 1'

# Read-only checkout. GitHub Packages access for @nvcct/* deps comes from the
# PACKAGES_READ_TOKEN secret (see .github/actions/setup), not this token.
permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          packages-token: ${{ secrets.PACKAGES_READ_TOKEN }}

      - name: Audit (fail on high+)
        run: pnpm audit --audit-level=high
