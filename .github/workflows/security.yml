name: Security

on:
  push:
    branches: [uat, main]
  pull_request:
    branches: [uat, main]
  schedule:
    # Weekly, Monday 06:00 UTC — catches newly disclosed CVEs in pinned deps.
    - cron: '0 6 * * 1'

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Audit (fail on high+)
        run: pnpm audit --audit-level=high
