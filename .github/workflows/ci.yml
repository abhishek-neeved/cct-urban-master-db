name: CI

on:
  push:
    branches: [uat, main]
  pull_request:
    branches: [uat, main]

# Read-only checkout. GitHub Packages access for @nvcct/* deps comes from the
# PACKAGES_READ_TOKEN secret (see .github/actions/setup), not this token.
permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Each check is its own job so they all run in parallel.
jobs:
  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          packages-token: ${{ secrets.PACKAGES_READ_TOKEN }}
      - run: pnpm format:check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          packages-token: ${{ secrets.PACKAGES_READ_TOKEN }}
      - run: pnpm lint

  type-check:
    name: Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          packages-token: ${{ secrets.PACKAGES_READ_TOKEN }}
      - run: pnpm type-check

  knip:
    name: Unused code / deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          packages-token: ${{ secrets.PACKAGES_READ_TOKEN }}
      - run: pnpm knip

  spell:
    name: Spell check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          packages-token: ${{ secrets.PACKAGES_READ_TOKEN }}
      - run: pnpm spell

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          packages-token: ${{ secrets.PACKAGES_READ_TOKEN }}
      - run: pnpm build

  test:
    name: Test (unit + integration + e2e) with 100% coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          packages-token: ${{ secrets.PACKAGES_READ_TOKEN }}
      - run: pnpm test:coverage
