version: 2
updates:
  # Application dependencies (Dependabot reads pnpm-lock.yaml via the npm ecosystem).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Batch low-risk dev tooling into a single PR to cut noise.
      dev-dependencies:
        dependency-type: development

  # Keep the GitHub Actions used in workflows up to date.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
